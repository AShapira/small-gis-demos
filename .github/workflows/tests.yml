name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  kartoza-affine-hook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kartoza-geoserver-affine-fix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sha256sum -c SHA256SUMS
      - run: bash -n apply-affine-fix.sh start-with-affine-fix.sh
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  blazor-openlayers:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/blazor-openlayers/.artifacts/nuget-packages
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/blazor-openlayers/.artifacts/nuget-http-cache
    defaults:
      run:
        working-directory: blazor-openlayers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: blazor-openlayers/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode --no-http-cache
      - name: Keep prepared offline-bundle source out of the app build
        run: |
          New-Item -ItemType Directory -Force offline-bundle/source | Out-Null
          Copy-Item Program.cs, MapOptions.cs, SampleGraphics.cs offline-bundle/source/
      - run: dotnet publish -c Release --no-restore -o .artifacts/publish
      - run: npm install --prefix .artifacts/browser playwright@1.58.2
      - run: '& .\.artifacts\browser\node_modules\.bin\playwright.cmd install chromium'
      - run: node tests/browser.mjs
  osm-basemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s osm-basemap-demo/tests -v
  cesium-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesium-wms-gutter-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cesium-wms-gutter-demo/package-lock.json
      - run: npm ci
      - run: npm test
  geotiff-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal python3-numpy
      - run: /usr/bin/python3 -m unittest discover -s geotiff-merge/tests -v
      - run: /usr/bin/python3 -m unittest discover -s vrt-overviews/tests -v
      - run: /usr/bin/python3 -m unittest discover -s nasadem-cog/tests -v
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geotiff-compression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/fetch_test_dependency.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .:.build/copernicus
      - name: Parse standalone script with Python 3.7 grammar
        working-directory: .
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('overview-generator/overview-generator.py').read_text(), feature_version=(3, 7))
          PY
